italian_market: &italian_market
  name: Italian Market
  city: *philly
  embed_id: "8a72b961-aca8-43ac-81de-0411004fc4bd"
  tagline: "The original pigeon tour! Visit South Philly, featuring the 9th St Italian Market."
  distance: 1 mile / 1.6 km
  duration: 90 mins - 2 hrs
  neighborhood: Bella Vista
  binoculars: true
  points:
    start: We meet outside Get a Gato cat cafe, 638 Christian Street (7th & Christian).
    end: The tour ends at the same location.
  accessibility: default
  restroom: |
    There is a restroom at the start/end location.

    There are no convenient public restrooms on our route, but in an emergency there are nearby businesses.
  food: |
    Get a Gato has baked goods, coffee/tea drinks, and water. We recommend arriving at least 15 minutes early if you plan to order something &mdash; the line can be long when we have full tours!
  transit: |
    From the Lombard-South station (Broad Street Line southbound), walk 20 minutes or take the 40 bus to 7th St.

    From the Ellsworth-Federal station (Broad Street Line northbound), walk 20 minutes or take the 64 bus to 7th St.

    From 8th St Station (Market-Frankford Line / "The L"), walk 20 minutes or take the 47 bus to Christian St.

  parking:
    locations: |
      - 2-hour free street parking (not too difficult to find, except on event/festival weekends)
      - \"forever parking\", not-time limited (always very difficult to find)
      - paid parking near South Street, less than a 10-minute walk from the meetup location
    note: |
      Tours are between 90 minutes and two hours long, giving you a short window before and after the tour to move your car. Be aware, parking in this neighborhood is strictly enforced.
  learn_more_emoji: 🇮🇹
  url: /philly/italian-market

center_city: &center_city
  name: Center City
  city: *philly
  embed_id: "80aacbb1-5a2f-489d-a26c-d9e9dbe1ad9e"
  tagline: "Meet the pigeons of City&nbsp;Hall and Reading Terminal Market!"
  distance: 1 mile / 1.6 km
  duration: 90 mins - 2 hrs
  neighborhood: Center City
  binoculars: true
  points:
    start: We start the tour at Philadelphia City Hall.
    end: The tour ends in the same location.
  restroom: |
    Restrooms are sometimes available at City Hall, when the building is open. Some tours start before the building opens.

    An accessible public toilet ("Philly Phlush") is always available at 15th & Arch, near our start/end location.

    There is also a restroom at our second stop near Reading Terminal Market.
  food: |
    We recommend bringing water with you. There are food
    establishments near City Hall you can visit before or after the tour.
  transit: |
    On the Market-Frankford Line ("The L"), get off at **15th&nbsp;St / City&nbsp;Hall&nbsp;Station**.

    On Regional Rail, travel to **Suburban&nbsp;Station**.
  parking:
    locations: |
      - 2-hour free street parking (hard to find)
      - 2-hour paid parking spots
      - Paid parking garages
    note: |
      Street parking in this area is both challenging to find and strictly enforced.
  learn_more_emoji: 🔔
  url: /philly/center-city

