{% assign image = site.data.images[include.name] %}
<figure>
  <img src="{{ image.src | relative_url }}" alt="{{ image.alt }}" title="{{ image.title }}" class="{{ include.class }}" />
  <figcaption>
  {% if include.caption | default: true, allow_false: true %}{{ image.caption }}{% endif %}{{ image.credit }}
  </figcaption>
</figure>
