
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, minimum-scale=1.0">

{% if page.title != empty %}
  {% assign title = page.title | append: " - Philly Pigeon Tours" %}
{% else %}
  {% assign title = site.title %}
{% endif %}

{% assign desc = page.description | default: site.description %}


<title>{{ title }}</title>

<!-- HTML Meta Tags -->
<meta name="description" content="{{ desc }}">
<meta property="og:locale" content="en_US" />

<!-- Open Graph Meta Tags -->
<meta property="og:url" content="https://phillypigeontours.com">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ title }}">
<meta property="og:site_name" content="Philly Pigeon Tours">
<meta property="og:description" content="{{ desc }}">
<meta property="og:image" content="/assets/images/hero.png">
<meta property="og:updated_time" content="{{ page.date }}"/>

<!-- Twitter Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta property="twitter:domain" content="phillypigeontours.com">
<meta property="twitter:url" content="https://phillypigeontours.com">
<meta name="twitter:title" content="Philly Pigeon Tours - World&#x27;s Best Rated Pigeon Tour Company">
<meta name="twitter:description" content="{{ desc }}">
<meta name="twitter:image" content="/assets/images/hero.png">

<meta name="msapplication-TileColor" content="#c0f0f7"/>
