title: Philly Pigeon Tours - The iconic tour changing the way people see pigeons
email: hello@phillypigeontours.com
description: >-
  In Philly, we love our trash animals. Unlearn the pigeon hate
  and develop a new relationship with your bird neighbors.
baseurl: ""
url: phillypigeontours.com

collections:
  pages:
    output: true
    permalink: /:path/

layouts_dir: layouts

defaults:
  -
    scope:
      path: "" # = all files
    values:
      layout: "default"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

plugins:
  - jekyll-sitemap
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - layouts
